<style>
  /* Homepage sections sit inside the theme's .vp-doc container, which already
     carries the hero's horizontal padding, so sections add vertical rhythm only. */
  .VPHomeContent .ce-section { margin: 48px 0 0; }
  .VPHomeContent .ce-section > p { max-width: 720px; }
  .VPHomeContent .ce-section:first-child { margin-top: 0; }
  .VPHome .VPHero { padding-top: 104px; padding-bottom: 16px; }
  .VPHome .VPHero .main { max-width: 820px; }
  .VPHome .VPHero .text { max-width: 760px; }
  .VPHome .VPHero .tagline { max-width: 640px; }
  .VPHomeContent .ce-section h2 { border-top: 0; margin: 0 0 8px; padding-top: 0; font-size: 22px; letter-spacing: -0.01em; }
  .VPHomeContent .ce-section > p { margin: 0 0 16px; color: var(--vp-c-text-2); line-height: 1.6; }
  .VPHomeContent .ce-install .language-text { max-width: 720px; }

  .ce-explainer { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 12px; border: 1px solid var(--vp-c-divider); background: #1B1B1F; }
  .ce-explainer-stage, .ce-explainer-stage > div { position: absolute; left: 0; top: 0; }
  .ce-explainer-stage > div { transform-origin: 0 0; }
  .ce-explainer-toggle { position: absolute; right: 12px; bottom: 12px; width: 32px; height: 32px; border: 1px solid rgba(223,223,214,0.2); border-radius: 50%; background: rgba(22,22,24,0.7); cursor: pointer; opacity: 0.6; transition: opacity .15s; }
  .ce-explainer:hover .ce-explainer-toggle, .ce-explainer-toggle:focus-visible { opacity: 1; }
  .ce-explainer-toggle:focus-visible { outline: 2px solid var(--vp-c-brand-1); outline-offset: 2px; }
  .ce-explainer-toggle::before { content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .ce-explainer-toggle[data-state="playing"]::before { width: 10px; height: 12px; border-left: 3px solid #DFDFD6; border-right: 3px solid #DFDFD6; box-sizing: border-box; }
  .ce-explainer-toggle[data-state="paused"]::before { margin-left: 1px; border-style: solid; border-width: 6px 0 6px 10px; border-color: transparent transparent transparent #DFDFD6; }
  .ce-visually-hidden { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .VPHomeContent .ce-section h3 { margin: 32px 0 4px; font-size: 15px; font-weight: 600; }
  .VPHomeContent .ce-section h3 a { color: inherit; text-decoration: none; }
  .ce-muted { color: var(--vp-c-text-3); font-size: 14px; line-height: 1.6; margin: 12px 0 0; }
  .VPHomeContent .ce-install .language-text { margin: 12px 0 0; }
  .VPHomeContent .ce-install .language-text .lang, .VPHomeContent .ce-install .language-text > span:first-child { display: none; }

  .vp-doc ol.ce-steps { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 32px; }
  .vp-doc .ce-steps li { margin: 0; padding: 14px 0; border-top: 1px solid var(--vp-c-divider); display: flex; flex-direction: column; gap: 2px; }
  .vp-doc .ce-steps li strong { font-weight: 600; }
  .vp-doc .ce-steps li span { color: var(--vp-c-text-2); font-size: 14px; line-height: 1.5; }
  @media (max-width: 960px) { .vp-doc ol.ce-steps { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px) { .vp-doc ol.ce-steps { grid-template-columns: 1fr; } }

  .vp-doc ul.ce-skill-index { list-style: none; margin: 0; padding: 0; }
  .vp-doc .ce-skill-index li { margin: 0; padding: 12px 0; border-top: 1px solid var(--vp-c-divider); display: grid; grid-template-columns: 200px 1fr; gap: 16px; align-items: baseline; }
  .vp-doc .ce-skill-index li:last-child { border-bottom: 1px solid var(--vp-c-divider); }
  .vp-doc .ce-skill-index a { text-decoration: none; }
  .vp-doc .ce-skill-index .ce-group { font-weight: 600; color: var(--vp-c-text-1); }
  .vp-doc .ce-skill-index .ce-names { display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .vp-doc .ce-skill-index .ce-names code { background: none; padding: 0; font-size: 14px; color: var(--vp-c-text-2); }
  .vp-doc .ce-skill-index a:hover code, .vp-doc .ce-skill-index a:focus-visible code { color: var(--vp-c-text-1); text-decoration: underline; text-underline-offset: 3px; }
  @media (max-width: 640px) { .vp-doc .ce-skill-index li { grid-template-columns: 1fr; gap: 6px; } }

  .vp-doc ul.ce-links { list-style: none; margin: 0; padding: 0; }
  .vp-doc .ce-links li { margin: 0; padding: 8px 0; border-top: 1px solid var(--vp-c-divider); }
  .vp-doc .ce-links li:last-child { border-bottom: 1px solid var(--vp-c-divider); }
  .vp-doc .ce-links a { text-decoration: none; }
  .vp-doc .ce-links a:hover { text-decoration: underline; text-underline-offset: 3px; }
</style>
