# Layout template: johnny-decimal -- areas (10-19), categories (11), ids
# (11.01). Ids are never reused. Community layout; the `{id:02d}` slot is the
# decimal id inside a category.
# Grammar: block mappings, scalars, and inline [a, b] lists only.
name: johnny-decimal
description: "Johnny.Decimal: numbered areas and categories with stable two-digit ids inside each category."
id_scheme: johnny-decimal
roles:
  inbox:
    path: "00-09 System/01 Inbox/"
    filename: "{date}-{slug}.md"
    types: [source, idea, note]
  memory:
    path: "00-09 System/02 Memory/"
    filename: "{date}.md"
  templates:
    path: "00-09 System/03 Templates/"
    filename: "{slug}.md"
    types: [template]
  projects:
    path: "10-19 Projects/11 Active/11.{id:02d} {slug}/"
    filename: README.md
    types: [project]
  notes:
    path: "10-19 Projects/11 Active/11.{id:02d} {slug}/notes/"
    filename: "{date}-{slug}.md"
    types: [note]
  sources:
    path: "20-29 Knowledge/21 Sources/"
    filename: "{date}-{slug}.md"
    types: [source]
  ideas:
    path: "20-29 Knowledge/22 Ideas/"
    filename: "{date}-{slug}.md"
    types: [idea]
  learnings:
    path: "20-29 Knowledge/23 Learnings/"
    filename: "{date}-{slug}.md"
    types: [learning]
  archive:
    path: "90-99 Archive/"
    filename: "{date}-{slug}.md"
  scratch:
    path: scratch/
    retention: discard
    tracked: false
frontmatter:
  required: [title, type, date]
  type_enum: [project, note, source, idea, learning, template]
  provenance: [generated_with]
  source_keys: [source_id, source, source_date, source_url, source_file, source_access]
  source_access_enum: [public, link, private, mixed]
promotion:
  inbox: [sources, ideas, notes]
  notes: [learnings]
  learnings: [pack-rule]
retention:
  inbox_flag_after_days: 14
git:
  mode: none
  allow: []
index: none
