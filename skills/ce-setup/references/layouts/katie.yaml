# Layout template: katie -- four layers: command center -> project homes ->
# project records -> knowledge. Promotion is a ladder (record -> learning ->
# pack rule) and nothing enters a pack without cited evidence and a held-out
# reuse check. Approximation from the brainstorm thread; validate with Katie.
# Grammar: block mappings, scalars, and inline [a, b] lists only.
name: katie
description: "Command center, project homes, project records, knowledge: an explicit promotion ladder with held-out reuse before anything becomes a rule."
id_scheme: none
roles:
  inbox:
    path: command-center/inbox/
    filename: "{date}-{slug}.md"
    types: [source, idea, note]
  ideas:
    path: command-center/ideas/
    filename: "{date}-{slug}.md"
    types: [idea]
  themes:
    path: command-center/themes/
    filename: "{slug}.md"
    types: [theme]
  projects:
    path: "projects/{slug}/"
    filename: README.md
    types: [project]
  notes:
    path: "projects/{slug}/records/"
    filename: "{date}-{slug}.md"
    types: [note]
  sources:
    path: knowledge/sources/
    filename: "{date}-{slug}.md"
    types: [source]
  learnings:
    path: knowledge/learnings/
    filename: "{date}-{slug}.md"
    types: [learning]
  memory:
    path: knowledge/memory/
    filename: "{date}.md"
  templates:
    path: knowledge/templates/
    filename: "{slug}.md"
    types: [template]
  archive:
    path: archive/
    filename: "{date}-{slug}.md"
  scratch:
    path: scratch/
    retention: discard
    tracked: false
frontmatter:
  required: [title, type, date, author]
  type_enum: [project, note, source, idea, theme, learning, template]
  provenance: [generated_with]
  source_keys: [source_id, source, source_date, source_url, source_file, source_access]
  source_access_enum: [public, link, private, mixed]
promotion:
  inbox: [sources, ideas, notes]
  notes: [learnings]
  learnings: [pack-rule]
retention:
  inbox_flag_after_days: 7
git:
  mode: none
  allow: []
index: none
