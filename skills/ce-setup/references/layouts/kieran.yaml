# Layout template: kieran -- the frontier-experiments folder, extracted verbatim.
# Numbered experiment folders (never renumbered), flat sources/ideas/themes,
# learnings/ doubles as the CE artifact root. inbox/ and learnings/memory/ are
# the two additions the compound loop needs; the template creates them on use.
# Grammar: block mappings, scalars, and inline [a, b] lists only.
name: kieran
description: "Numbered experiments with flat sources, ideas, themes, and transferable learnings; learnings/ is the CE artifact root."
id_scheme: sequential
docs_root: learnings
roles:
  inbox:
    path: inbox/
    filename: "{date}-{slug}.md"
    types: [source, idea, note]
  sources:
    path: sources/
    filename: "{date}-{slug}.md"
    types: [source]
  ideas:
    path: ideas/
    filename: "{date}-{slug}.md"
    types: [idea]
  themes:
    path: themes/
    filename: "{slug}.md"
    types: [theme]
  projects:
    path: "experiments/{id:03d}-{slug}/"
    filename: README.md
    types: [experiment]
  notes:
    path: "experiments/{id:03d}-{slug}/notes/"
    filename: "{date}-{slug}.md"
    types: [note]
  learnings:
    path: learnings/
    filename: "{date}-{slug}.md"
    types: [learning]
  writing:
    path: "experiments/{id:03d}-{slug}/"
    filename: learning.md
    types: [weekly-learning]
  memory:
    path: learnings/memory/
    filename: "{date}.md"
  templates:
    path: templates/
    filename: "{slug}.md"
    types: [template]
  scratch:
    path: .local/
    retention: discard
    tracked: false
frontmatter:
  required: [title, type, date, author]
  type_enum: [experiment, weekly-learning, learning, note, source, idea, theme, template, workflow, guidance, strategy, glossary]
  provenance: [generated_with]
  source_keys: [source_id, source, source_date, source_url, source_file, source_access, source_coverage]
  source_access_enum: [public, link, every, private, mixed]
promotion:
  inbox: [sources, ideas, notes]
  notes: [learnings]
  learnings: [pack-rule]
retention:
  inbox_flag_after_days: 14
git:
  mode: commit+push
  allow: [inbox/, sources/]
index: none
