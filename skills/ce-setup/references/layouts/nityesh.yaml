# Layout template: nityesh -- Projects/, Work/ (ephemeral), Notes/, Diary/.
# Raw agent-session logs are kept on purpose as diary sources and are never
# promoted without a paraphrased note. The external index (qmd) is not part
# of phase 1: `index` stays `none` here. Approximation; validate with Nityesh.
# Grammar: block mappings, scalars, and inline [a, b] lists only.
name: nityesh
description: "Projects, ephemeral Work, Notes, and a dated Diary that keeps raw session logs as sources."
id_scheme: date
roles:
  inbox:
    path: Notes/inbox/
    filename: "{date}-{slug}.md"
    types: [source, idea, note]
  projects:
    path: "Projects/{slug}/"
    filename: README.md
    types: [project]
  notes:
    path: Notes/
    filename: "{date}-{slug}.md"
    types: [note, idea]
  sources:
    path: Diary/
    filename: "{date}-{slug}.md"
    types: [source, session]
  learnings:
    path: Notes/learnings/
    filename: "{date}-{slug}.md"
    types: [learning]
  memory:
    path: Notes/memory/
    filename: "{date}.md"
  scratch:
    path: Work/
    retention: discard
    tracked: false
frontmatter:
  required: [title, type, date]
  type_enum: [project, note, idea, source, session, learning]
  provenance: [generated_with]
  source_keys: [source_id, source, source_date, source_url, source_file, source_access]
  source_access_enum: [public, link, private, mixed]
promotion:
  inbox: [sources, notes]
  sources: [notes]
  notes: [learnings]
  learnings: [pack-rule]
retention:
  inbox_flag_after_days: 14
git:
  mode: none
  allow: []
index: none
