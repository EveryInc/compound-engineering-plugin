# Layout template: none -- inbox + learnings only (Mike-mode).
# Everything else stays wherever the user keeps it; no role means "do not
# create, do not file here". memory/ nests under learnings/ so the folder
# gains no third top-level directory.
# Grammar: block mappings, scalars, and inline [a, b] lists only.
name: none
description: "Two folders: an inbox for captures and a learnings folder for what transfers. Nothing else is prescribed."
id_scheme: none
roles:
  inbox:
    path: inbox/
    filename: "{date}-{slug}.md"
    types: [source, idea, note]
  learnings:
    path: learnings/
    filename: "{date}-{slug}.md"
    types: [learning]
  memory:
    path: learnings/memory/
    filename: "{date}.md"
  scratch:
    path: scratch/
    retention: discard
    tracked: false
frontmatter:
  required: [title, type, date]
  type_enum: [learning, note, source, idea]
  provenance: [generated_with]
  source_keys: [source_id, source, source_date, source_url, source_file, source_access]
  source_access_enum: [public, link, private, mixed]
promotion:
  inbox: [learnings]
  learnings: [pack-rule]
retention:
  inbox_flag_after_days: 14
git:
  mode: none
  allow: []
index: none
